<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Čistá generatívna ASCII kytica slnečníc a lúčnych kvetov v reálnom čase (110 stĺpcov) optimalizovaná pre mobil a desktop.">
  <title>Slnečnicová Kytica (110 stĺpcov) | ASCII Floral Art</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23040306'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='18' fill='%23f59e0b' text-anchor='middle' font-weight='bold'%3E*%3C/text%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #030205;
      --ink: #fdf8e6;
      --ink-dim: #9e9684;
      --accent: #f59e0b;
      --accent-gold: #fbbf24;
      --accent-warm: #d97706;
      --line: rgba(255, 255, 255, 0.12);
      --glass: rgba(14, 11, 18, 0.75);
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --serif: "Instrument Serif", Georgia, serif;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--mono);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Plátno vycentrované a prispôsobené veľkosti obrazovky */
    .viewport {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding: clamp(52px, 8vh, 70px) clamp(8px, 3vw, 24px) clamp(60px, 9vh, 80px);
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 0.74;
      object-fit: contain;
      cursor: grab;
      box-shadow: 0 16px 64px rgba(0, 0, 0, 0.8), 0 0 80px rgba(245, 158, 11, 0.05);
      transition: transform 0.2s ease-out;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* Jemný horný indikátor */
    .top-bar {
      position: absolute;
      top: max(10px, env(safe-area-inset-top, 10px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 5px 14px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-dim);
      z-index: 20;
      white-space: nowrap;
      pointer-events: auto;
      max-width: calc(100vw - 24px);
    }

    .top-bar .title-badge {
      color: var(--accent-gold);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .top-bar .title-badge::before {
      content: "✦";
      font-size: 9px;
    }

    .top-bar a {
      color: var(--ink-dim);
      text-decoration: none;
      transition: color 0.15s;
    }

    .top-bar a:hover {
      color: var(--ink);
    }

    /* Plávajúci spodný panel ovládačov */
    .bottom-bar {
      position: absolute;
      bottom: max(12px, env(safe-area-inset-bottom, 12px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      border-radius: 999px;
      z-index: 20;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      max-width: calc(100vw - 16px);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .bottom-bar::-webkit-scrollbar {
      display: none;
    }

    .btn {
      font-family: inherit;
      font-size: 11.5px;
      letter-spacing: 0.04em;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn:hover {
      border-color: var(--accent);
      background: rgba(245, 158, 11, 0.12);
      color: #ffffff;
    }

    .btn-primary {
      background: rgba(245, 158, 11, 0.18);
      border-color: var(--accent);
      color: #fff9e6;
      font-weight: 500;
    }

    .btn-primary:hover {
      background: var(--accent);
      color: #040306;
    }

    .detail-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 6px;
      font-size: 11px;
      color: var(--ink-dim);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .detail-pill input[type="range"] {
      width: 56px;
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .detail-pill input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: var(--accent-gold);
      border-radius: 50%;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .top-bar {
        font-size: 10px;
        gap: 8px;
        padding: 4px 10px;
      }
      .top-bar .title-badge {
        display: none;
      }
      .detail-pill input[type="range"] {
        display: none;
      }
      .bottom-bar {
        padding: 5px 8px;
        gap: 5px;
      }
      .btn {
        padding: 5px 10px;
        font-size: 10.5px;
        gap: 4px;
      }
    }

    /* Toast hlásenie */
    .toast {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: var(--accent-gold);
      color: #040306;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Darčeková karta pri venovaní */
    .gift-overlay {
      position: fixed;
      bottom: max(76px, calc(env(safe-area-inset-bottom, 16px) + 60px));
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      max-width: 440px;
      width: calc(100% - 32px);
      background: rgba(12, 9, 16, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--accent);
      padding: 16px 20px;
      display: grid;
      gap: 6px;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
      z-index: 30;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85);
    }

    .gift-overlay.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .gift-overlay .gift-to {
      font-family: var(--serif);
      font-size: 1.35rem;
      font-style: italic;
      color: var(--accent-gold);
    }

    .gift-overlay .gift-msg {
      font-size: 12.5px;
      line-height: 1.5;
      color: #f1ebd8;
    }

    .gift-overlay .gift-from {
      font-size: 10.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-top: 2px;
    }

    .gift-close {
      position: absolute;
      top: 8px;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--ink-dim);
      font-size: 18px;
      cursor: pointer;
    }

    /* Modal pre venovanie */
    .share-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 2, 5, 0.86);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 120;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .share-modal.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 400px;
      background: #09070c;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      display: grid;
      gap: 14px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.85);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-family: var(--serif);
      font-size: 1.45rem;
      font-weight: 400;
      color: var(--ink);
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--ink-dim);
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }

    .modal-input {
      width: 100%;
      background: #030205;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      font-family: inherit;
      font-size: 12.5px;
      padding: 9px 12px;
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--accent);
    }

    @media (max-width: 600px) {
      .detail-pill input[type="range"] {
        display: none;
      }
      .bottom-bar {
        padding: 6px 10px;
        gap: 6px;
      }
      .btn {
        padding: 6px 11px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>

  <!-- Horná informačná lišta -->
  <header class="top-bar" id="topBar">
    <span class="title-badge">Slnečnicová Kytica</span>
    <span id="statusInfo">Rozkvitanie...</span>
    <a href="index.html" title="Prejsť na plnú galériovú verziu">Galéria</a>
  </header>

  <!-- Hlavná vycentrovaná plocha plátna -->
  <main class="viewport">
    <canvas id="art" aria-label="Animovaná ASCII kytica slnečníc kalibrovaná na 110 stĺpcov"></canvas>
  </main>

  <!-- Spodný plávajúci ovládací panel -->
  <nav class="bottom-bar">
    <button type="button" class="btn btn-primary" id="btnReplay" title="Spustiť kvitnutie odznova">Rozkvitnúť znova</button>

    <div class="detail-pill">
      <span id="colsLabel">110 stĺpcov</span>
      <input id="detailRange" type="range" min="88" max="136" step="2" value="110" aria-label="Jemné doladenie hustoty">
    </div>

    <button type="button" class="btn" id="btnDedicate" title="Pridať osobné venovanie">Venovať</button>
    <button type="button" class="btn" id="btnSavePng" title="Uložiť ako PNG">Uložiť PNG</button>
  </nav>

  <!-- Kartička s venovaním -->
  <div class="gift-overlay" id="giftOverlay">
    <button type="button" class="gift-close" id="giftClose" aria-label="Zavrieť">&times;</button>
    <div class="gift-to" id="giftTo">Pre Teba</div>
    <div class="gift-msg" id="giftMsg">Slnko a kvety, ktoré nikdy nezvädnú, pretože sú napísané v kóde.</div>
    <div class="gift-from" id="giftFrom">S láskou</div>
  </div>

  <!-- Dialóg venovania -->
  <div class="share-modal" id="shareModal" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle">
    <div class="modal-box">
      <div class="modal-head">
        <h2 class="modal-title" id="shareModalTitle">Venovanie ku kytici</h2>
        <button type="button" class="modal-close" id="modalClose" aria-label="Zavrieť">&times;</button>
      </div>
      <div>
        <label style="font-size: 11px; text-transform: uppercase; color: var(--ink-dim); display: block; margin-bottom: 4px;" for="inputTo">Komu</label>
        <input class="modal-input" id="inputTo" maxlength="50" placeholder="napr. Anna" autocomplete="off">
      </div>
      <div>
        <label style="font-size: 11px; text-transform: uppercase; color: var(--ink-dim); display: block; margin-bottom: 4px;" for="inputMsg">Odkaz</label>
        <input class="modal-input" id="inputMsg" maxlength="160" placeholder="napr. Krásny slnečný deň!" autocomplete="off">
      </div>
      <div>
        <label style="font-size: 11px; text-transform: uppercase; color: var(--ink-dim); display: block; margin-bottom: 4px;" for="inputFrom">Od koho</label>
        <input class="modal-input" id="inputFrom" maxlength="50" placeholder="napr. Peter" autocomplete="off">
      </div>
      <button type="button" class="btn btn-primary" id="btnCopyLink" style="justify-content: center; margin-top: 6px;">Skopírovať odkaz na kyticu</button>
    </div>
  </div>

  <div class="toast" id="toast">Odkaz skopírovaný</div>

  <script src="js/botanic.js"></script>
  <script src="js/bouquet.js"></script>
  <script src="js/ascii-render.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/gift.js"></script>

  <script>
  (function () {
    'use strict';

    var MONO = '"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    var ASPECT = 0.74;
    var S = 3;
    var BG = '#030205';
    var TARGET_COLS = 110; // Presná kalibrácia na ~110 stĺpcov podľa požiadavky
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var canvas = document.getElementById('art');
    var ctx = canvas.getContext('2d');
    var off = document.createElement('canvas');
    var octx = off.getContext('2d', { willReadFrequently: true });
    var viewportEl = document.querySelector('.viewport');

    var renderer = AsciiRasterizer.createAsciiRenderer({
      samplesPerCell: S,
      background: BG
    });
    var particles = ParticleSystem.createParticleSystem(4211);
    var bouquet = BouquetScene.buildBouquet(7731);

    var userCols = TARGET_COLS;
    var cols = 110, rows = 74, cw = 7.0, ch = 14.0, fs = 12;
    var Wd = 770, Hd = 1036, Hu = 1.35, SW = 0, SH = 0, dpr = 1;
    var hashes = new Uint32Array(1);
    var t0 = performance.now(), last = 0, frameNo = 0, activeCount = 0;
    var targetWind = 0, currentMouseWind = 0;

    var statusInfo = document.getElementById('statusInfo');
    var colsLabel = document.getElementById('colsLabel');
    var detailRange = document.getElementById('detailRange');
    var giftOverlay = document.getElementById('giftOverlay');
    var giftShown = false;

    var gift = GiftModule.initGift({
      giftWrap: giftOverlay,
      giftTo: document.getElementById('giftTo'),
      giftMsg: document.getElementById('giftMsg'),
      giftFrom: document.getElementById('giftFrom'),
      shareModal: document.getElementById('shareModal'),
      inputTo: document.getElementById('inputTo'),
      inputMsg: document.getElementById('inputMsg'),
      inputFrom: document.getElementById('inputFrom'),
      toast: document.getElementById('toast')
    });

    /* Presný rozmerový výpočet kalibrovaný na mobil aj desktop */
    function layout() {
      var vw = viewportEl.clientWidth || window.innerWidth;
      var vh = viewportEl.clientHeight || window.innerHeight;

      // Zohľadnenie pomeru strán kytice 0.74
      var availW = Math.min(vw - 20, (vh - 40) * ASPECT);
      var availH = availW / ASPECT;

      cols = userCols;
      fs = availW / cols / 0.6;
      ctx.font = '500 ' + fs + 'px ' + MONO;
      var m = ctx.measureText('M').width;
      cw = m > 0 ? m : fs * 0.6;
      ch = fs * 1.2;
      Wd = cols * cw;
      rows = Math.max(20, Math.round(Wd / ASPECT / ch));
      Hd = rows * ch;
      Hu = Hd / Wd;

      SW = cols * S;
      SH = rows * S;

      dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      canvas.width = Math.round(Wd * dpr);
      canvas.height = Math.round(Hd * dpr);
      canvas.style.width = Math.round(Wd) + 'px';
      canvas.style.height = Math.round(Hd) + 'px';

      off.width = SW;
      off.height = SH;

      hashes = new Uint32Array(cols * rows);
      for (var i = 0; i < hashes.length; i++) {
        hashes[i] = BotanicEngine.hash(i);
      }

      if (colsLabel) colsLabel.textContent = cols + ' stĺpcov';
      if (detailRange && detailRange.value != cols) detailRange.value = cols;
    }

    function render(time, T, extraWind) {
      BouquetScene.renderBouquetScene(octx, bouquet, T, time, SW, SH, Hu, extraWind);

      activeCount = renderer.renderAscii(octx, ctx, {
        SW: SW,
        SH: SH,
        cols: cols,
        rows: rows,
        cw: cw,
        ch: ch,
        Wd: Wd,
        Hd: Hd,
        dpr: dpr,
        hashes: hashes,
        frameNo: frameNo,
        reduceMotion: reduce,
        particles: particles,
        time: time
      });
    }

    function updateInfo(T) {
      if (statusInfo) {
        if (T < 4.5 && !reduce && !forcedBloom) {
          var pct = Math.min(100, Math.round((T / 4.5) * 100));
          statusInfo.textContent = 'Rozkvitanie ' + pct + '% (' + activeCount + ' znakov)';
        } else {
          statusInfo.textContent = activeCount.toLocaleString('sk-SK') + ' znakov • 110 stĺpcov';
        }
      }
    }

    var urlParams = new URLSearchParams(window.location.search);
    var forcedBloom = urlParams.has('bloom');

    function frame(now) {
      frameNo++;
      var T = (reduce || forcedBloom) ? 6.0 : (now - t0) * 0.001;
      var time = reduce ? 0 : now * 0.001;

      currentMouseWind += (targetWind - currentMouseWind) * 0.06;
      render(time, T, currentMouseWind);

      if (now - last > 180) {
        updateInfo(T);
        last = now;
      }

      // Automatické zobrazenie venovania po rozkvitnutí (ak je nastavené cez URL)
      if (!giftShown && T > 4.6) {
        giftShown = true;
        var p = gift.getParams();
        if (p.to || p.msg || p.from) {
          gift.showCard();
        }
      }

      requestAnimationFrame(frame);
    }

    // Interaktívny fyzikálny vánok myšou a dotykom
    window.addEventListener('mousemove', function (e) {
      var relX = (e.clientX / window.innerWidth) - 0.5;
      targetWind = relX * 1.5;
    });

    window.addEventListener('mouseleave', function () {
      targetWind = 0;
    });

    window.addEventListener('touchmove', function (e) {
      if (e.touches && e.touches[0]) {
        var relX = (e.touches[0].clientX / window.innerWidth) - 0.5;
        targetWind = relX * 1.5;
      }
    }, { passive: true });

    window.addEventListener('touchend', function () {
      targetWind = 0;
    });

    // Zmena veľkosti okna
    window.addEventListener('resize', function () {
      layout();
      updateInfo(6.0);
    });

    // Tlačidlo Rozkvitnúť znova
    document.getElementById('btnReplay').addEventListener('click', function () {
      t0 = performance.now();
      giftShown = false;
      forcedBloom = false;
      bouquet = BouquetScene.buildBouquet(Math.floor(Math.random() * 10000));
    });

    // Posuvník pre jemné doladenie hustoty (90 - 130 stĺpcov)
    if (detailRange) {
      detailRange.addEventListener('input', function () {
        userCols = parseInt(detailRange.value, 10);
        layout();
        updateInfo(6.0);
      });
    }

    // Tlačidlo Venovať
    var shareModal = document.getElementById('shareModal');
    var btnDedicate = document.getElementById('btnDedicate');
    var modalClose = document.getElementById('modalClose');
    var btnCopyLink = document.getElementById('btnCopyLink');
    var giftClose = document.getElementById('giftClose');

    btnDedicate.addEventListener('click', function () {
      shareModal.classList.add('open');
    });

    modalClose.addEventListener('click', function () {
      shareModal.classList.remove('open');
    });

    shareModal.addEventListener('click', function (e) {
      if (e.target === shareModal) shareModal.classList.remove('open');
    });

    btnCopyLink.addEventListener('click', function () {
      gift.copyShareLink();
    });

    if (giftClose) {
      giftClose.addEventListener('click', function () {
        giftOverlay.classList.remove('visible');
      });
    }

    // Uložiť PNG
    document.getElementById('btnSavePng').addEventListener('click', function () {
      var link = document.createElement('a');
      link.download = 'slnecnicova-kytica-110cols.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      gift.showToast('PNG obrázok kytice uložený');
    });

    // Spustenie
    layout();
    updateInfo(0);

    if (document.fonts && document.fonts.load) {
      document.fonts.load('500 12px "JetBrains Mono"').then(function () {
        layout();
        updateInfo(0);
      }, function () {});
    }

    if (reduce) {
      render(0, 8.0, 0);
      updateInfo(8.0);
    } else {
      requestAnimationFrame(frame);
    }
  })();
  </script>
</body>
</html>
