  <script>if (window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)) { document.documentElement.classList.add("app"); }</script>
  <script>if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }</script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #030205;
      overflow: hidden;
      margin: 0;
      padding: 0;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html.app {
      height: auto;
      min-height: 100%;
      min-height: calc(100% + env(safe-area-inset-top, 0px));
      min-height: min(100lvh, calc(100% + env(safe-area-inset-top, 0px)));
    }

    @media (display-mode: standalone) {
      html {
        height: auto;
        min-height: min(100lvh, calc(100% + env(safe-area-inset-top, 0px)));
      }
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      border: none;
      box-shadow: none;
      touch-action: none;
    }
  </style>
</head>
<body>

  <canvas id="art" aria-label="ASCII Slnečnicová Kytica"></canvas>

  <script src="js/botanic.js"></script>
  <script src="js/bouquet.js"></script>
  <script src="js/ascii-render.js"></script>

  <script>
  (function () {
    'use strict';

    var MONO = '"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    var S = 3;
    var BG = '#030205';
    var TARGET_COLS = 110;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var canvas = document.getElementById('art');
    var ctx = canvas.getContext('2d');
    var off = document.createElement('canvas');
    var octx = off.getContext('2d', { willReadFrequently: true });

    var renderer = AsciiRasterizer.createAsciiRenderer({
      samplesPerCell: S,
      background: BG
    });

    var currentSeed = 7731;
    var Hu = 1.36;
    var bouquetOpts = { bleed: true };
    var bouquet = BouquetScene.buildBouquet(currentSeed, Hu, bouquetOpts);

    var cols = TARGET_COLS, rows = 0, cw = 0, ch = 0, fs = 0;
    var Wd = 0, Hd = 0, SW = 0, SH = 0, dpr = 1;
    var layoutInfo = null;
    var hashes = new Uint32Array(1);
    var t0 = performance.now(), frameNo = 0;
    var targetWind = 0, currentMouseWind = 0;

    var insetProbe = document.createElement('div');
    insetProbe.setAttribute('aria-hidden', 'true');
    insetProbe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
      'padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
    document.body.appendChild(insetProbe);

    function safeInsets() {
      var cs = window.getComputedStyle(insetProbe);
      return {
        top: parseFloat(cs.paddingTop) || 0,
        right: parseFloat(cs.paddingRight) || 0,
        bottom: parseFloat(cs.paddingBottom) || 0,
        left: parseFloat(cs.paddingLeft) || 0
      };
    }

    function viewportSize() {
      var w = window.innerWidth, h = window.innerHeight;
      var docH = Math.round(document.documentElement.getBoundingClientRect().height);
      if (docH > h && docH - h <= 140) h = docH;
      return { w: w, h: h };
    }

    var lastSizeKey = '';
    function sizeKey() {
      var vp = viewportSize();
      var ins = safeInsets();
      return vp.w + 'x' + vp.h + '|' + ins.top + ',' + ins.right + ',' + ins.bottom + ',' + ins.left;
    }

    var debugEl = null;
    function showDebug(info) {
      if (!/[?&]debug(?:[=&]|$)/.test(window.location.search)) return;
      if (!debugEl) {
        debugEl = document.createElement('pre');
        debugEl.style.cssText = 'position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:9;margin:0;' +
          'padding:6px 8px;font:11px/1.4 ui-monospace,Menlo,monospace;color:#fbf6e2;background:rgba(0,0,0,.75);' +
          'border:1px solid #444;border-radius:6px;pointer-events:none;white-space:pre';
        document.body.appendChild(debugEl);
      }
      debugEl.textContent = info;
    }

    function layout() {
      lastSizeKey = sizeKey();
      var vp = viewportSize();
      var vw = vp.w;
      var vh = vp.h;
      var isPortrait = (vh >= vw);
      var ins = safeInsets();

      ctx.font = '500 50px ' + MONO;
      var testM = ctx.measureText('M').width;
      var fontRatio = (testM > 0) ? (testM / 50) : 0.55;

      var bouquetCols = TARGET_COLS;
      var colOffset = 0, rowOffset = 0, bouquetRows = 0;

      if (isPortrait) {
        cols = TARGET_COLS;
        cw = vw / cols;
        fs = cw / fontRatio;
        ch = fs * 1.20;
        rows = Math.max(24, Math.round(vh / ch));
        ch = vh / rows;
        var topRows = Math.ceil(ins.top / ch);
        rowOffset = topRows;
        bouquetRows = Math.max(20, rows - topRows);
        Hu = (bouquetRows * ch) / (cols * cw);
      } else {
        var availH = Math.max(vh * 0.5, vh - ins.top);
        var targetBouquetH = availH * 0.92;
        var targetBouquetW = targetBouquetH / 1.36;
        var approxCw = targetBouquetW / TARGET_COLS;
        cols = Math.max(TARGET_COLS, Math.round(vw / approxCw));
        cw = vw / cols;
        fs = cw / fontRatio;
        ch = fs * 1.20;
        rows = Math.max(28, Math.round(vh / ch));
        ch = vh / rows;

        bouquetRows = Math.max(24, Math.min(rows, Math.round(targetBouquetH / ch)));
        Hu = (bouquetRows * ch) / (bouquetCols * cw);
        colOffset = Math.max(0, Math.floor((cols - bouquetCols) / 2));
        rowOffset = Math.max(Math.ceil(ins.top / ch), rows - bouquetRows);
      }

      Wd = vw;
      Hd = vh;
      SW = cols * S;
      SH = rows * S;

      layoutInfo = {
        S: S,
        cols: cols,
        rows: rows,
        colOffset: colOffset,
        rowOffset: rowOffset,
        bouquetCols: bouquetCols,
        bouquetRows: bouquetRows
      };

      dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      canvas.width = Math.round(Wd * dpr);
      canvas.height = Math.round(Hd * dpr);
      canvas.style.width = Wd + 'px';
      canvas.style.height = Hd + 'px';
      ctx.font = '500 ' + fs + 'px ' + MONO;

      off.width = SW;
      off.height = SH;

      hashes = new Uint32Array(cols * rows);
      for (var i = 0; i < hashes.length; i++) {
        hashes[i] = BotanicEngine.hash(i);
      }

      bouquet = BouquetScene.buildBouquet(currentSeed, Hu, bouquetOpts);

      var standalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      showDebug([
        'inner    ' + window.innerWidth + ' x ' + window.innerHeight,
        'visualVP ' + (window.visualViewport ? Math.round(window.visualViewport.width) + ' x ' + Math.round(window.visualViewport.height) : '-'),
        'client   ' + document.documentElement.clientWidth + ' x ' + document.documentElement.clientHeight,
        'screen   ' + (window.screen ? window.screen.width + ' x ' + window.screen.height : '-'),
        'html     ' + Math.round(document.documentElement.getBoundingClientRect().height),
        'použité  ' + vw + ' x ' + vh + '  dpr ' + dpr,
        'insets   t' + ins.top + ' r' + ins.right + ' b' + ins.bottom + ' l' + ins.left,
        'riadky   ' + rows + '  kytica ' + bouquetRows + '  od ' + rowOffset,
        'appka    ' + (standalone ? 'áno (z plochy)' : 'nie (prehliadač)')
      ].join('\n'));
    }

    function render(time, T, extraWind) {
      ctx.font = '500 ' + fs + 'px ' + MONO;
      BouquetScene.renderBouquetScene(octx, bouquet, T, time, SW, SH, Hu, extraWind, cw, ch, layoutInfo);

      renderer.renderAscii(octx, ctx, {
        SW: SW,
        SH: SH,
        cols: cols,
        rows: rows,
        cw: cw,
        ch: ch,
        Wd: Wd,
        Hd: Hd,
        dpr: dpr,
        hashes: hashes,
        frameNo: frameNo,
        reduceMotion: reduce,
        particles: null,
        time: time
      });
    }

    var urlParams = new URLSearchParams(window.location.search);
    var forcedBloom = urlParams.has('bloom');
    var seedParam = urlParams.get('seed');
    if (seedParam) {
      var parsedSeed = parseInt(seedParam, 10);
      if (Number.isFinite(parsedSeed) && parsedSeed > 0 && parsedSeed <= 2147483647) {
        currentSeed = parsedSeed;
      }
    }

    function frame(now) {
      frameNo++;
      var T = (reduce || forcedBloom) ? 6.0 : (now - t0) * 0.001;
      var time = reduce ? 0 : now * 0.001;

      currentMouseWind += (targetWind - currentMouseWind) * 0.06;

      render(time, T, currentMouseWind);
      requestAnimationFrame(frame);
    }

    var lastRebloomTime = 0;
    function rebloom() {
      var now = performance.now();
      if (now - lastRebloomTime < 400) return;
      lastRebloomTime = now;

      t0 = now;
      forcedBloom = false;
      currentSeed = Math.floor(Math.random() * 100000);
      bouquet = BouquetScene.buildBouquet(currentSeed, Hu, bouquetOpts);
    }

    window.addEventListener('click', function () {
      rebloom();
    });

    var touchStartX = 0, touchStartY = 0, touchStartTime = 0;
    window.addEventListener('touchstart', function (e) {
      if (e.touches && e.touches[0]) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = performance.now();
      }
    }, { passive: true });

    window.addEventListener('touchend', function (e) {
      var dt = performance.now() - touchStartTime;
      var dx = (e.changedTouches && e.changedTouches[0]) ? Math.abs(e.changedTouches[0].clientX - touchStartX) : 0;
      var dy = (e.changedTouches && e.changedTouches[0]) ? Math.abs(e.changedTouches[0].clientY - touchStartY) : 0;

      if (dt < 350 && dx < 12 && dy < 12) {
        rebloom();
      }
      targetWind = 0;
    }, { passive: true });

    window.addEventListener('mousemove', function (e) {
      var relX = (e.clientX / window.innerWidth) - 0.5;
      targetWind = relX * 1.5;
    });

    window.addEventListener('mouseleave', function () {
      targetWind = 0;
    });

    window.addEventListener('touchmove', function (e) {
      if (e.touches && e.touches[0]) {
        var relX = (e.touches[0].clientX / window.innerWidth) - 0.5;
        targetWind = relX * 1.5;
      }
    }, { passive: true });

    function relayout() {
      layout();
      if (reduce) render(0, 8.0, 0);
    }
    var pendingKey = '', pendingSince = 0;
    function checkSize() {
      var k = sizeKey();
      var now = performance.now();
      if (k === lastSizeKey) { pendingKey = ''; return; }
      if (k !== pendingKey) { pendingKey = k; pendingSince = now; return; }
      if (now - pendingSince >= 200) relayout();
    }
    setInterval(checkSize, 100);
    window.addEventListener('resize', checkSize);
    window.addEventListener('orientationchange', checkSize);
    window.addEventListener('pageshow', checkSize);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) checkSize();
    });

    layout();

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () {
        layout();
      });
    }

    if (reduce) {
      render(0, 8.0, 0);
    } else {
      requestAnimationFrame(frame);
    }
  })();
  </script>
</body>
