<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Slnečnicová Kytica | ASCII Floral Art</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23030205'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='18' fill='%23f59e0b' text-anchor='middle' font-weight='bold'%3E*%3C/text%3E%3C/svg%3E">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #030205;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    canvas {
      display: block;
      object-fit: contain;
      outline: none;
      box-shadow: 0 0 80px rgba(245, 158, 11, 0.04);
    }
  </style>
</head>
<body>

  <canvas id="art" aria-label="ASCII Slnečnicová Kytica"></canvas>

  <script src="js/botanic.js"></script>
  <script src="js/bouquet.js"></script>
  <script src="js/ascii-render.js"></script>
  <script src="js/particles.js"></script>

  <script>
  (function () {
    'use strict';

    var MONO = '"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    var S = 3;
    var BG = '#030205';
    var TARGET_COLS = 110; // Presný level detailov ~110 stĺpcov
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var canvas = document.getElementById('art');
    var ctx = canvas.getContext('2d');
    var off = document.createElement('canvas');
    var octx = off.getContext('2d', { willReadFrequently: true });

    var renderer = AsciiRasterizer.createAsciiRenderer({
      samplesPerCell: S,
      background: BG
    });
    var particles = ParticleSystem.createParticleSystem(4211);

    var currentSeed = 7731;
    var Hu = 1.36;
    var bouquet = BouquetScene.buildBouquet(currentSeed, Hu);

    var cols = TARGET_COLS, rows = 76, cw = 7.0, ch = 14.0, fs = 12;
    var Wd = 770, Hd = 1040, SW = 0, SH = 0, dpr = 1;
    var hashes = new Uint32Array(1);
    var t0 = performance.now(), frameNo = 0;
    var targetWind = 0, currentMouseWind = 0;

    /* Nativny responsivny layout - efektivne vyuziva plochu na mobile aj PC */
    function layout() {
      var vw = window.innerWidth;
      var vh = window.innerHeight;

      // Zistenie pomeru strán zariadenia
      var isPortrait = (vh > vw * 1.15);

      // Na mobile: kytica má vyšší vertikálny profil (Hu ≈ 1.48 - 1.62) a vyplní celú výšku displeja
      // Na PC / desktope: kytica má harmonický proporčný profil (Hu ≈ 1.36) a vyplní 96% výšky
      Hu = isPortrait ? Math.min(1.65, Math.max(1.46, (vh / vw) * 0.76)) : 1.36;

      var maxW = vw * (isPortrait ? 0.98 : 0.96);
      var maxH = vh * (isPortrait ? 0.98 : 0.96);

      if (maxW * Hu <= maxH) {
        Wd = maxW;
        Hd = Wd * Hu;
      } else {
        Hd = maxH;
        Wd = Hd / Hu;
      }

      cols = TARGET_COLS;
      fs = Wd / cols / 0.6;
      ctx.font = '500 ' + fs + 'px ' + MONO;
      var m = ctx.measureText('M').width;
      cw = m > 0 ? m : fs * 0.6;
      ch = fs * 1.2;

      // Presné zarovnanie na mriežku
      Wd = cols * cw;
      rows = Math.max(20, Math.round(Hd / ch));
      Hd = rows * ch;
      Hu = Hd / Wd;

      SW = cols * S;
      SH = rows * S;

      dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      canvas.width = Math.round(Wd * dpr);
      canvas.height = Math.round(Hd * dpr);
      canvas.style.width = Math.round(Wd) + 'px';
      canvas.style.height = Math.round(Hd) + 'px';

      off.width = SW;
      off.height = SH;

      hashes = new Uint32Array(cols * rows);
      for (var i = 0; i < hashes.length; i++) {
        hashes[i] = BotanicEngine.hash(i);
      }

      // Prestavba kytice s prispôsobenou dĺžkou stoniek pre daný displej
      bouquet = BouquetScene.buildBouquet(currentSeed, Hu);
    }

    function render(time, T, extraWind) {
      BouquetScene.renderBouquetScene(octx, bouquet, T, time, SW, SH, Hu, extraWind);

      renderer.renderAscii(octx, ctx, {
        SW: SW,
        SH: SH,
        cols: cols,
        rows: rows,
        cw: cw,
        ch: ch,
        Wd: Wd,
        Hd: Hd,
        dpr: dpr,
        hashes: hashes,
        frameNo: frameNo,
        reduceMotion: reduce,
        particles: particles,
        time: time
      });
    }

    var urlParams = new URLSearchParams(window.location.search);
    var forcedBloom = urlParams.has('bloom');
    var seedParam = urlParams.get('seed');
    if (seedParam) currentSeed = parseInt(seedParam, 10) || currentSeed;

    function frame(now) {
      frameNo++;
      var T = (reduce || forcedBloom) ? 6.0 : (now - t0) * 0.001;
      var time = reduce ? 0 : now * 0.001;

      // Organická reakcia stoniek na pohyb
      currentMouseWind += (targetWind - currentMouseWind) * 0.06;

      render(time, T, currentMouseWind);
      requestAnimationFrame(frame);
    }

    /* Opätovné rozkvitnutie po kliknutí / ťuknutí kdekoľvek na obrazovku */
    function rebloom() {
      t0 = performance.now();
      forcedBloom = false;
      currentSeed = Math.floor(Math.random() * 100000);
      bouquet = BouquetScene.buildBouquet(currentSeed, Hu);
    }

    // Kliknutie myšou na PC
    window.addEventListener('click', function () {
      rebloom();
    });

    // Ťuknutie na mobile (odlíšenie tapu od posunu prsta)
    var touchStartX = 0, touchStartY = 0, touchStartTime = 0;
    window.addEventListener('touchstart', function (e) {
      if (e.touches && e.touches[0]) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = performance.now();
      }
    }, { passive: true });

    window.addEventListener('touchend', function (e) {
      var dt = performance.now() - touchStartTime;
      var dx = (e.changedTouches && e.changedTouches[0]) ? Math.abs(e.changedTouches[0].clientX - touchStartX) : 0;
      var dy = (e.changedTouches && e.changedTouches[0]) ? Math.abs(e.changedTouches[0].clientY - touchStartY) : 0;

      // Ak išlo o krátke ťuknutie na mieste, spustiť rozkvitnutie
      if (dt < 350 && dx < 12 && dy < 12) {
        rebloom();
      }
      targetWind = 0;
    }, { passive: true });

    // Jemný vánok pri pohybe myši
    window.addEventListener('mousemove', function (e) {
      var relX = (e.clientX / window.innerWidth) - 0.5;
      targetWind = relX * 1.5;
    });

    window.addEventListener('mouseleave', function () {
      targetWind = 0;
    });

    // Jemný vánok pri ťahaní prstom po displeji
    window.addEventListener('touchmove', function (e) {
      if (e.touches && e.touches[0]) {
        var relX = (e.touches[0].clientX / window.innerWidth) - 0.5;
        targetWind = relX * 1.5;
      }
    }, { passive: true });

    // Nativne prispôsobenie pri otočení obrazovky alebo zmene okna
    window.addEventListener('resize', function () {
      layout();
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        layout();
      });
    }

    layout();

    if (document.fonts && document.fonts.load) {
      document.fonts.load('500 12px "JetBrains Mono"').then(function () {
        layout();
      }, function () {});
    }

    if (reduce) {
      render(0, 8.0, 0);
    } else {
      requestAnimationFrame(frame);
    }
  })();
  </script>
</body>
</html>
