  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #030205;
      overflow: hidden;
      margin: 0;
      padding: 0;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      outline: none;
      border: none;
      box-shadow: none;
      touch-action: none;
    }
  </style>
</head>
<body>

  <canvas id="art" aria-label="ASCII Slnečnicová Kytica"></canvas>

  <script src="js/botanic.js"></script>
  <script src="js/bouquet.js"></script>
  <script src="js/ascii-render.js"></script>

  <script>
  (function () {
    'use strict';

    var MONO = '"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    var S = 3;
    var BG = '#030205';
    var TARGET_COLS = 110;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var canvas = document.getElementById('art');
    var ctx = canvas.getContext('2d');
    var off = document.createElement('canvas');
    var octx = off.getContext('2d', { willReadFrequently: true });

    var renderer = AsciiRasterizer.createAsciiRenderer({
      samplesPerCell: S,
      background: BG
    });

    var currentSeed = 7731;
    var Hu = 1.36;
    var bouquet = BouquetScene.buildBouquet(currentSeed, Hu);

    var cols = TARGET_COLS, rows = 0, cw = 0, ch = 0, fs = 0;
    var Wd = 0, Hd = 0, SW = 0, SH = 0, dpr = 1;
    var layoutInfo = null;
    var hashes = new Uint32Array(1);
    var t0 = performance.now(), frameNo = 0;
    var targetWind = 0, currentMouseWind = 0;

    /* Nativny responsivny layout - 100% fullscreen celistva plocha bez vyrezov na mobile aj PC */
    function layout() {
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var isPortrait = (vh >= vw);

      ctx.font = '500 50px ' + MONO;
      var testM = ctx.measureText('M').width;
      var fontRatio = (testM > 0) ? (testM / 50) : 0.55;

      var bouquetCols = TARGET_COLS;
      var colOffset = 0, rowOffset = 0, bouquetRows = 0;

      if (isPortrait) {
        // Mobil / Portrait: plátno natívne vyplní celú obrazovku s ~110 stĺpcami
        cols = TARGET_COLS;
        cw = vw / cols;
        fs = cw / fontRatio;
        ch = fs * 1.20;
        rows = Math.max(24, Math.round(vh / ch));
        ch = vh / rows;
        bouquetRows = rows;
        Hu = (rows * ch) / (cols * cw);
      } else {
        // Desktop / PC (Landscape): majestátna kytica vycentrovaná v strede širokouhlého monitora
        // Kytica zaberá elegantných ~92% výšky obrazovky bez akýchkoľvek okrajov či výrezov
        var targetBouquetH = vh * 0.92;
        var targetBouquetW = targetBouquetH / 1.36;
        var approxCw = targetBouquetW / TARGET_COLS;
        cols = Math.max(TARGET_COLS, Math.round(vw / approxCw));
        cw = vw / cols;
        fs = cw / fontRatio;
        ch = fs * 1.20;
        rows = Math.max(28, Math.round(vh / ch));
        ch = vh / rows;

        bouquetRows = Math.max(24, Math.min(rows, Math.round(targetBouquetH / ch)));
        Hu = (bouquetRows * ch) / (bouquetCols * cw);
        colOffset = Math.max(0, Math.floor((cols - bouquetCols) / 2));
        rowOffset = Math.max(0, Math.floor((rows - bouquetRows) / 2));
      }

      Wd = vw;
      Hd = vh;
      SW = cols * S;
      SH = rows * S;

      layoutInfo = {
        S: S,
        cols: cols,
        rows: rows,
        colOffset: colOffset,
        rowOffset: rowOffset,
        bouquetCols: bouquetCols,
        bouquetRows: bouquetRows
      };

      dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      canvas.width = Math.round(Wd * dpr);
      canvas.height = Math.round(Hd * dpr);
      canvas.style.width = Wd + 'px';
      canvas.style.height = Hd + 'px';
      ctx.font = '500 ' + fs + 'px ' + MONO;

      off.width = SW;
      off.height = SH;

      hashes = new Uint32Array(cols * rows);
      for (var i = 0; i < hashes.length; i++) {
        hashes[i] = BotanicEngine.hash(i);
      }

      bouquet = BouquetScene.buildBouquet(currentSeed, Hu);
    }

    function render(time, T, extraWind) {
      ctx.font = '500 ' + fs + 'px ' + MONO;
      BouquetScene.renderBouquetScene(octx, bouquet, T, time, SW, SH, Hu, extraWind, cw, ch, layoutInfo);

      renderer.renderAscii(octx, ctx, {
        SW: SW,
        SH: SH,
        cols: cols,
        rows: rows,
        cw: cw,
        ch: ch,
        Wd: Wd,
        Hd: Hd,
        dpr: dpr,
        hashes: hashes,
        frameNo: frameNo,
        reduceMotion: reduce,
        particles: null,
        time: time
      });
    }

    var urlParams = new URLSearchParams(window.location.search);
    var forcedBloom = urlParams.has('bloom');
    var seedParam = urlParams.get('seed');
    if (seedParam) {
      var parsedSeed = parseInt(seedParam, 10);
      if (Number.isFinite(parsedSeed) && parsedSeed > 0 && parsedSeed <= 2147483647) {
        currentSeed = parsedSeed;
      }
    }

    function frame(now) {
      frameNo++;
      var T = (reduce || forcedBloom) ? 6.0 : (now - t0) * 0.001;
      var time = reduce ? 0 : now * 0.001;

      // Organická reakcia stoniek na pohyb
      currentMouseWind += (targetWind - currentMouseWind) * 0.06;

      render(time, T, currentMouseWind);
      requestAnimationFrame(frame);
    }

    /* Opätovné rozkvitnutie po kliknutí / ťuknutí kdekoľvek na obrazovku */
    var lastRebloomTime = 0;
    function rebloom() {
      var now = performance.now();
      // Ochrana pred dvojitým spustením (touchend + syntetizovaný click na mobilných prehliadačoch)
      if (now - lastRebloomTime < 400) return;
      lastRebloomTime = now;

      t0 = now;
      forcedBloom = false;
      currentSeed = Math.floor(Math.random() * 100000);
      bouquet = BouquetScene.buildBouquet(currentSeed, Hu);
    }

    // Kliknutie myšou na PC
    window.addEventListener('click', function () {
      rebloom();
    });

    // Ťuknutie na mobile (odlíšenie tapu od posunu prsta)
    var touchStartX = 0, touchStartY = 0, touchStartTime = 0;
    window.addEventListener('touchstart', function (e) {
      if (e.touches && e.touches[0]) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = performance.now();
      }
    }, { passive: true });

    window.addEventListener('touchend', function (e) {
      var dt = performance.now() - touchStartTime;
      var dx = (e.changedTouches && e.changedTouches[0]) ? Math.abs(e.changedTouches[0].clientX - touchStartX) : 0;
      var dy = (e.changedTouches && e.changedTouches[0]) ? Math.abs(e.changedTouches[0].clientY - touchStartY) : 0;

      // Ak išlo o krátke ťuknutie na mieste, spustiť rozkvitnutie
      if (dt < 350 && dx < 12 && dy < 12) {
        rebloom();
      }
      targetWind = 0;
    }, { passive: true });

    // Jemný vánok pri pohybe myši
    window.addEventListener('mousemove', function (e) {
      var relX = (e.clientX / window.innerWidth) - 0.5;
      targetWind = relX * 1.5;
    });

    window.addEventListener('mouseleave', function () {
      targetWind = 0;
    });

    // Jemný vánok pri ťahaní prstom po displeji
    window.addEventListener('touchmove', function (e) {
      if (e.touches && e.touches[0]) {
        var relX = (e.touches[0].clientX / window.innerWidth) - 0.5;
        targetWind = relX * 1.5;
      }
    }, { passive: true });

    // Nativne prispôsobenie pri otočení obrazovky alebo zmene okna
    window.addEventListener('resize', function () {
      layout();
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        layout();
      });
    }

    layout();

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () {
        layout();
      });
    }

    if (reduce) {
      render(0, 8.0, 0);
    } else {
      requestAnimationFrame(frame);
    }
  })();
  </script>
</body>
